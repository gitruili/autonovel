# ── Prompt Fragments ──
prompt_fragments:
  seed:
    generate_requirements: |
      ## 每个概念必须包含以下要素

      ### 开局困境
      女主一开始面临的具体困境是什么？要有画面感和紧迫感。
      好例子："醒来发现自己成了七零年代被退婚的乡下丫头，成分是富农，兜里三斤粮票，外面还下着雪。"
      坏例子："穿越到年代生活很艰难。"（太笼统）

      ### 具体年代/地点
      具体的年代和生活环境。不要只说"七十年代"，要明确到哪一年、
      什么地区（东北/江南/西北/沿海）、城市还是农村、
      周边有什么地理特征和经济特征。
      体现出"这个年代+这个地方"独有的生存规则和发展机会。

      ### 金手指
      女主的核心优势是什么？可以是：
        - 前世记忆（重生文：知道未来几十年的政策走向和商机）
        - 现代知识穿越（医术、厨艺、经商头脑等）
        - 随身空间/灵泉/系统（但必须有明确限制，且在政治环境下有暴露风险）
        - 或者纯粹靠前世经验和性格（无金手指硬核年代文）
      关键：金手指必须有时代局限性——在政治敏感的年代，任何"异常"都可能引来灾祸。
      不能让女主无所不能，否则没有戏剧张力。

      ### 时代升级线
      女主的核心发家/逆袭路线是什么？要具体到产业或路径，并且设计出3-4个升级台阶。
      好例子："利用现代腌制技术做酱菜→摆摊攒钱→改革开放后第一批个体户→开铺子→成为万元户"
      坏例子："做生意赚钱。"（太笼统）
      时代升级线是故事的骨架，每个台阶都应该对应一个时代机遇和新的挑战。

      ### 人际困局
      女主面临的人际关系核心矛盾是什么？
        - 家庭内部：极品亲戚、刻薄婆婆/继母、争家产、分家等
        - 外部势力：基层干部、生产队长、供销社售货员、竞争对手等
        - 时代矛盾：成分歧视、户口限制、政治立场对立等
        人际线和时代线必须互相咬合——比如经营做大了反而招来嫉妒和举报。

      ### 情感线
      男主是谁？他的人设亮点是什么？他和女主的感情发展逻辑是什么？
      男主不能是完美霸总，必须有自己的困境或缺陷（军人身份受限、成分问题、家庭压力等）。
      感情线要有"日久生情"的真实感——从互相防备/无感到并肩作战到心动。
      要考虑时代约束（组织介绍、成分审查、政治立场）。
      要设计至少一个"名场面"（让读者截图分享的心动瞬间）。

      ### 主题
      这个故事的精神内核是什么？
      好例子："一个人到底是被出身定义，还是被自己的选择定义？"
      坏例子："努力就会成功。"（太说教）

    diversity_requirements: |
      ## 多样性要求
      确保这 {count} 个概念具有多样性：
        - 至少有一个知青下乡流（重心在农村生活和回城机遇）
        - 至少有一个改革开放个体户流（重心在下海经商和时代红利）
        - 至少有一个军婚流（重心在军嫂生活和军人家庭）
        - 至少有一个大院生活流（重心在工厂/单位大院的人际博弈）
        - 至少有一个纯硬核无金手指的（纯靠前世经验和时代眼光翻身）
        - 混合不同年代：六零年困难时期、七零年知青下乡、八零年改革开放、九零年下海潮

    prohibitions: |
      ## 禁止生成
        - 女主一穿越就被军官/干部子弟看上的"霸总"套路
        - 金手指没有任何限制、女主无所不能的"躺赢"设定
        - 男主替女主解决所有问题、女主只负责"美"的花瓶设定
        - 所有配角都是坏人/所有好人都帮女主的黑白脸谱化
        - 忽略票证制度、阶级成分等时代约束的"伪年代文"
        - 纯虐文或BE结局（年代文的核心是"生活越来越好"的希望感）
        - 政治运动被轻描淡写或美化的
        - 穿越时空的现代词汇和行为方式

    output_template: |
      ## 输出模板（严格按此格式）

      # 创意<序号>：《<书名>》

      ## 作品简介
      <按照简介设计原则撰写，标签放在最前面，3-4段，短句为主，情绪炸裂>

      ## 核心卖点
      <一句话描述核心卖点/核心梗：女主走上怎样的逆袭之路？最大的爽点是什么？>

      ## 开局困境
      <具体的、有画面感的起始困境>

      ## 金手指与局限
      <金手指是什么？时代局限性是什么？政治风险是什么？>

      ## 时代升级线
      <3-4个升级台阶，每个台阶对应的时代机遇、爽点和挑战>

      ## 人际困局
      <家庭内部矛盾 + 外部势力矛盾 + 时代矛盾>

      ## 情感线
      <男主人设 + 感情发展逻辑 + 至少一个名场面设计>

      ## 具体年代/地点
      <具体的年代、地区、政治经济环境>

      ## 主题
      <一句话精神内核>

    riff_requirements: |
      基于这个概念生成 5 个变体。保留核心构思中吸引人的部分，但将其推向不同的方向。

      确保这些变体之间有真正的区别——不要只是微调表面细节。
      可以改变的维度包括：具体年代、地区、金手指类型、升级路线、男主人设、
      家庭关系结构、故事基调（温馨 vs 爽文 vs 细水长流）。

      按以下模板输出每个变体：

      # 创意<序号>：《<书名>》

      ## 不同之处
      <从原始种子中改变了什么，为什么要改变？>

      ## 作品简介
      <按照简介设计原则撰写，标签放在最前面，3-4段，短句为主，情绪炸裂>

      ## 核心卖点
      <一句话核心卖点>

      ## 开局困境
      <具体困境>

      ## 金手指与局限
      <金手指 + 时代局限性>

      ## 时代升级线
      <3-4个升级台阶>

      ## 人际困局
      <家庭 + 外部 + 时代>

      ## 情感线
      <男主人设 + 感情逻辑 + 名场面>

      ## 具体年代/地点
      <具体背景>

      ## 爽点设计
      <最让读者拍案叫绝的"逆袭"时刻>

  world:
    requirements: |
      - 所有设定必须服务于"时代升级线"和"人际线"的推进
      - 经济数据必须自洽（收入与支出对得上，升级台阶在经济上合理）
      - 票证制度、户口制度必须既能制造冲突、又能被女主用智慧突破
      - 政治环境必须真实（不能美化也不能回避）
      - 每一条设定都要具体到可以直接用于写作的程度
      - 冰山原则：暗示的内容多于直接陈述的内容

    sections: |
      请按以下章节组织文档：

      ## 时代背景
      故事发生在哪一年？什么地区？当前的政治大环境是什么？
      最近发生了什么影响底层百姓生活的大事？政策环境如何？

      ## 经济体系
      ### 货币与物价
      列出核心物价清单（必须覆盖粮食、日用、住房、劳力、特殊品类）。
      注意：物价必须对应具体年代。
      ### 票证制度
      粮票、布票、肉票、工业券等各类票证的使用规则和稀缺程度。
      ### 工资与收入
      各行业工资标准、工分值、奖金制度。
      ### 商业环境
      供销社体系、黑市、个体户政策（如适用）。

      ## 社会结构
      ### 阶级成分
      贫农、中农、富农、地主、资本家等成分对日常生活的影响。
      ### 户口制度
      城乡户口差异、户口迁移限制、知青户口问题。
      ### 单位体制
      工厂/生产队/单位大院的权力结构和人际关系。
      ### 婚姻与家族
      组织介绍、成分审查、彩礼/嫁妆的时代特点。

      ## 地理与生活
      ### 核心地点
      城市/农村的具体生活环境（筒子楼/大院/农村土房/知青点）。
      ### 日常生活
      饮食、服饰、出行、娱乐的时代特征。
      ### 感官特征
      煤油灯、大喇叭、绿军装、的确良、收音机等时代标志物。

      ## 政治环境
      ### 运动影响
      当前或即将到来的政治运动对百姓生活的影响。
      ### 言论禁忌
      什么话不能说、什么事不能做、什么人不能接触。
      ### 风险与机遇
      政策变化可能带来的风险和机遇。

      ## 关键 NPC 与势力（非主角团）

      ## 内部一致性规则（作者不可违反）

  characters:
    requirements: |
      ### 核心驱动力框架
      每个主要角色都必须有清晰的驱动力链条：
        处境 (SITUATION) → 她/他最迫切想要什么？(WANT)
          → 她/他真正需要什么？(NEED，通常与 WANT 矛盾)
          → 她/他心底的错误信念是什么？(LIE，阻碍她/他的心结)
          → 她/他的弧光走向 (ARC，LIE 被打破或强化的过程)

      ### 对话辨识度（6 个维度，适配年代文）
      1. 用词习惯：文雅/粗俗/口头禅/地方方言/年代用语
      2. 句子长短：碎嘴啰嗦型还是惜字如金型？
      3. 说话语气：阴阳怪气/直来直去/绵里藏针/嘴硬心软
      4. 口头禅/语言癖好（注意年代差异：同志/社员/师傅/老板）
      5. 隐喻来源：农村人用庄稼比喻、军人用打仗比喻、商人用算账比喻
      6. 潜台词能力：话里有话还是有话直说？

      ### 人物关系网（年代文核心）
      年代文的戏剧张力大量来自人际关系。每个角色都必须：
      - 与至少 2 个其他角色存在利益冲突或情感纠葛
      - 有至少 1 个可能在故事中发生转变的关系
      - 阶级成分和政治立场必须影响人物关系

    role_types: |
      请从种子概念中提取所有涉及的角色，并为每个角色构建完整档案。
      通常一部年代文需要以下角色类型（根据种子概念调整具体人物）：

      ### 1. 女主（主角，视角人物）—— 最高优先级
      ### 2. 男主 —— 高优先级
      ### 3. 核心对手（家庭内部）—— 高优先级
      ### 4. 外部势力对手 —— 中优先级
      ### 5. 助力型配角 —— 中优先级
      ### 6. 年代文特色配角（基层干部/生产队长/供销社售货员/邻居大娘）—— 低优先级

  outline:
    structure: |
      ### 整体结构（四幕式，适配年代文节奏）

      **第一幕：开局困境（约 1-5 章，占全书 0-22%）**
      - 建立女主的处境：穿越/重生后面对的具体困境
      - 展示金手指的首次使用（但受限于政治环境）
      - 初步的人际冲突爆发（成分歧视、物资匮乏、被刁难）
      - 催化事件：迫使女主必须靠自己谋生的转折点
      - 男主的首次出场（自然，不刻意）

      **第二幕上：初步立足（约 6-11 章，占全书 22-48%）**
      - 时代升级线第一台阶→第二台阶的推进
      - 女主凭本事赢得初步认可（但也招来嫉妒）
      - 情感线破冰：从陌生/戒备到产生好感
      - 第一次打脸（小爽点）
      - 中点反转（约 48%）

      **第二幕下：遭遇打压（约 12-17 章，占全书 48-75%）**
      - 女主事业做大，引来举报/政治打压
      - 家庭内部矛盾激化
      - 情感线推进：并肩作战中感情升温
      - 低谷时刻（约 70%）

      **第三幕：逆袭与收获（约 18-24 章，占全书 75-100%）**
      - 政策变化/时代机遇改变局面
      - 女主利用时代红利化危为机
      - 大逆袭（核心爽点）
      - 时代升级线达到巅峰
      - 情感线明朗化
      - 大结局

    constraints: |
      1. **时代线不能断**：不能连续 3 章以上没有时代升级/时代细节的推进。
      2. **情感线自然推进**：男女主不能一见钟情，必须有"日久生情"的过程，且考虑时代约束。
      3. **经济逻辑自洽**：女主的每一笔收入和支出必须符合设定年代的物价体系。
      4. **打脸必须有铺垫**：每个打脸/逆袭场景之前，必须有至少 1-2 章的"被欺负"铺垫。
      5. **章尾钩子必须有**：每一章的结尾都必须留下悬念或期待感。
      6. **节奏张弛有度**：不能连续 3 章以上都是高强度冲突。
      7. **年代细节准确**：故事中的物价、政策、制度必须与设定年代吻合。
      8. **配角不是工具人**：极品亲戚每次出场都不能只是"来找麻烦"。
      9. **金手指使用有节制**：金手指不能每章都用，不能每次都完美解决问题，且有政治暴露风险。
      10. **票证制度贯穿**：物资匮乏必须体现在生活场景中，不能想买什么就买什么。

    ledgers: |
      ### 时代升级台账
      | 台阶 | 内容 | 对应年代 | 标志性事件 | 经济变化 |

      ### 情感线进度台账
      | 阶段 | 描述 | 章节范围 | 标志性名场面 |

      ### 伏笔台账
      | 线索 | 植入 (章) | 强化 (章) | 回收 (章) | 类型 |

      ### 打脸/爽点台账
      | 爽点 | 章节 | 被打脸的人 | 爽点描述 | 铺垫章节 |

  canon:
    sections: |
      ## 时代与政治
      ## 经济与物价
      ## 票证与户口
      ## 时间线
      ## 金手指规则
      ## 角色事实
      ## 社会制度
      ## 内部一致性规则

  chapter_draft:
    genre_specific_detail: |
      年代感细节要具体有质感——票证使用、工分计算、供销社购物、煤油灯照明都要写出来。
      对话要符合年代用语，避免穿越时空的现代词汇。

# ── Evaluation ──
evaluation:
  foundation:
    dimensions:
      historical_accuracy:
        label: "历史准确性"
        weight_group: "setting"
        description: "年代背景是否准确？物价、政策、社会制度是否与设定年代吻合？是否有穿越时空的错误？"
      economic_system:
        label: "经济体系"
        weight_group: "setting"
        description: "票证制度、工资标准、物价是否完整自洽？经济升级速度是否符合时代节奏？"
      social_structure:
        label: "社会结构"
        weight_group: "setting"
        description: "阶级成分、户口制度、单位体制是否明确？是否能制造合理冲突？"
      cheat_rules:
        label: "金手指规则"
        weight_group: "setting"
        description: "金手指在特定政治环境下是否有限制？是否能合理解释而不引起怀疑？"
      era_progression:
        label: "时代升级线"
        weight_group: "structure"
        description: "升级台阶是否与时代事件对应？是否充分利用了历史机遇？"
      face_slap_setup:
        label: "打脸铺垫"
        weight_group: "structure"
        description: "每个打脸/爽点是否有至少1-2章的铺垫？"
    cross_checks:
      - "历史年代交叉验证：故事中提到的政策、物价、制度是否在该年代真实存在？"
      - "阶级成分检查：角色的阶级成分是否影响了其社会地位和人际关系？"
      - "票证/户口检查：物资分配、出行限制是否体现了票证制度？"
      - "角色对话检查：对话是否符合年代用语？是否有穿越时空的现代词汇？"
      - "文档间矛盾检查：交叉对比年龄、年代、物价、关系。"
    weights:
      setting: 0.35
      character: 0.25
      structure: 0.30
      craft: 0.10

  chapter:
    dimensions:
      era_integration:
        label: "年代感整合度"
        description: "年代细节在本章中是否有实质作用？是否有时代特有的氛围？"
      emotional_payoff:
        label: "情感回报"
        description: "本章是否有至少一个情感爆发点（爽点/心动/委屈/感动）？"

# ── Reader Personas ──
reader_personas:
  genre_reader: |
    你是一个每年阅读上百部网文的资深读者，特别偏爱女频年代文、重生文和穿越文。
    你在乎年代感是否到位、逆袭是否痛快、时代红利是否抓得准。你讨厌违背历史常识的剧情
    和无脑金手指。你敏锐地察觉到年代细节的错误、节奏拖沓、或者反派降智的时刻。
    你喜欢看主角凭借前世记忆或现代知识在特定时代翻盘的过程。你对喜欢的情节毫不吝啬赞美，
    对无聊的桥段也会直言不讳。你只用有效的 JSON 格式回复。
  writer: |
    你是一位出版过五部畅销年代文的资深网络小说作家。
    你从手艺人的角度阅读。你关注结构：情节节拍落点在哪里，伏笔是否回收，
    角色弧光是否完整，金手指的设定是否平衡且有时代局限性。你关注作者的历史功底
    和时代细节的准确性。你最看重的是"期待感"的建立与释放。
    你在乎小说设定与实际呈现之间的差距。你只用有效的 JSON 格式回复。

# ── Voice Template ──
voice_template:
  tone_hint: |
    年代文的基调参考：
    "有烟火气的温暖，但底色是时代的粗粝。像冬天在大院里围着炉子烤红薯，
     听隔壁大娘讲谁家又分了几斤粮票。"
    "先苦后甜的踏实。文字像手里的活计——一针一线看得见，
     但背景是大喇叭里传来的革命歌曲。"
    "不矫情、不煽情，但该扎心的时候一句话扎到骨头里。
     年代的苦不是个人的苦，是整个时代的苦。"
  sentence_rhythm_hint: |
    "日常场景用松散的、带着口语感的中长句。
     情感爆发用短句。对话干脆利落，不拖泥带水。"
    "年代感描写段落允许详细（票证、工分、供销社排队），
     但人际冲突段落要快，像吵架一样来回打。"
  vocabulary_hint: |
    禁用现代词汇（比如"效率""流量""赋能""互联网"）。
    使用对应年代的日常口语。注意不同年代的称呼差异：
    50-60s: 同志、社员、工友、大兄弟
    70s: 知青、战友、贫下中农、革委会
    80-90s: 师傅、老板、个体户、万元户
    物资名称要准确（的确良、军绿、粮票、布票、工业券）。
  pov_hint: |
    年代文通常使用第三人称有限视角、过去时态，
    紧紧跟着女主的所见所闻所想。
  exemplar_scenes:
    - "一段年代生活场景（有票证细节、有物资匮乏感、有邻里互动）"
    - "一段家庭/大院冲突场景（有对话交锋、有成分/立场暗流）"
    - "一段情感暗涌场景（有心动描写、有克制、有时代约束感）"
    - "一段供销社/集市场景（有烟火气、有物资描写、有人情世故）"
    - "一段逆袭/打脸场景（有时代红利、有扬眉吐气、但不过火）"

# ── Mystery Template ──
mystery_template: |
  <!-- 年代文的悬念通常与身份、时代机遇、政治风险相关。
  常见类型：
    - 女主的穿越/重生身份是否会被发现
    - 男主的隐藏身份（军人身份、干部子弟等）及真正目的
    - 某个角色看似无害实则心怀叵测（可能举报/揭发）
    - 一笔被时代掩盖的旧事（成分问题、历史遗留）
    - 改革开放中的商业机遇与风险
    - 金手指暴露的政治风险 -->
