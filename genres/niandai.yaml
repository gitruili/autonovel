# genres/niandai.yaml — 年代文题材配置
# 年代文：故事设定在1950s-1990s中国，女主穿越/重生到特定历史时期，
# 凭借前世记忆或现代知识抓住时代机遇，从底层逆袭翻身。

genre_key: "niandai"
display_name: "年代文"
description: "故事设定在1950s-1990s中国，女主穿越/重生到特定历史时期，凭借前世记忆或现代知识抓住时代机遇，从底层逆袭翻身。核心是时代红利与个人奋斗的碰撞。"

