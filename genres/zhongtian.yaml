# ── Prompt Fragments ──
prompt_fragments:
  seed:
    generate_requirements: |
      ## 每个概念必须包含以下要素

      ### 开局困境
      女主一开始面临的具体困境是什么？要有画面感和紧迫感。
      好例子："醒来发现自己是个被婆家赶出来的弃妇，身边一个病秧子小叔子，兜里三文钱，外面还下着雪。"
      坏例子："穿越到古代生活很艰难。"（太笼统）

      ### 时代/地点
      具体的时代背景和生活环境。不要只说"古代"，要明确到什么样的村镇、
      什么气候、什么物产、周边有什么地理特征（靠山？临水？边关？盐场？茶山？渔村？）。
      体现出"这个地方"独有的生存规则和发展机会。

      ### 金手指
      女主的核心优势是什么？可以是：
        - 现代知识技能（医术、厨艺、农技、经商头脑、手工艺等）
        - 随身空间/灵泉/系统（但必须有明确限制和升级条件）
        - 前世记忆（重生文）
        - 或者纯粹靠智商和性格（无金手指硬核种田）
      关键：金手指必须有局限性（比如空间一天只能进去一次、灵泉水量有限、
      系统任务有时限等），不能让女主无所不能，否则没有戏剧张力。

      ### 种田线
      女主的核心经营/发家路线是什么？要具体到产业，并且设计出3-4个升级台阶。
      好例子："利用现代腌制技术做酱菜→摆摊攒钱→开铺子→建作坊供应府城大酒楼→成为一方商户"
      坏例子："种地赚钱。"（太笼统）
      种田线是故事的骨架，每个台阶都应该对应一个爽点爆发和新的挑战。

      ### 人际困局
      女主面临的人际关系核心矛盾是什么？
        - 家庭内部：极品亲戚、刻薄婆婆/继母、争家产、分家、立户等
        - 外部势力：恶霸乡绅、商业竞争对手、官府压迫等
        人际线和种田线必须互相咬合——比如经营做大了反而招来嫉妒和打压。

      ### 情感线
      男主是谁？他的人设亮点是什么？他和女主的感情发展逻辑是什么？
      男主不能是完美霸总，必须有自己的困境或缺陷（穷、伤残、被家族放逐、身份隐瞒等）。
      感情线要有"日久生情"的真实感——从互相防备/无感到并肩作战到心动。
      要设计至少一个"名场面"（让读者截图分享的心动瞬间）。

      ### 主题
      这个故事的精神内核是什么？
      好例子："一个人到底是被出身定义，还是被自己的选择定义？"
      坏例子："努力就会成功。"（太说教）

    diversity_requirements: |
      ## 多样性要求
      确保这 {count} 个概念具有多样性：
        - 至少有一个纯种田经营流（重心在产业发展，感情线为辅）
        - 至少有一个家宅/宅斗流（重心在家族内部的人情博弈）
        - 至少有一个有轻微奇幻元素的（空间/系统/异能，但主体仍是种田）
        - 至少有一个硬核无金手指的（纯靠智商、技能和人脉翻身）
        - 至少有一个非典型古代背景的（比如边关、海边渔村、少数民族聚居区、乱世逃荒）
        - 混合不同基调：温馨治愈、逆袭打脸、细水长流、先苦后甜

    prohibitions: |
      ## 禁止生成
        - 女主一穿越就被王爷/世子看上的"霸总"套路
        - 金手指没有任何限制、女主无所不能的"躺赢"设定
        - 男主替女主解决所有问题、女主只负责"美"的花瓶设定
        - 所有配角都是坏人/所有好人都帮女主的黑白脸谱化
        - 宫斗为主线的（我们要的是种田，不是后宫争宠）
        - 纯虐文或BE结局（种田文的核心是"生活越来越好"的希望感）
        - 如果是现实题材，请勿加入过多超现实元素和浮夸的设计，紧扣现实逻辑

    output_template: |
      ## 输出模板（严格按此格式）

      # 创意<序号>：《<书名>》

      ## 作品简介
      <按照简介设计原则撰写，标签放在最前面，3-4段，短句为主，情绪炸裂>

      ## 核心卖点
      <一句话描述核心卖点/核心梗：女主走上怎样的发家之路？最大的爽点是什么？>

      ## 开局困境
      <具体的、有画面感的起始困境>

      ## 金手指与局限
      <金手指是什么？局限性是什么？升级条件是什么？>

      ## 种田升级线
      <3-4个升级台阶，每个台阶对应的产业、爽点和挑战>

      ## 人际困局
      <家庭内部矛盾 + 外部势力矛盾>

      ## 情感线
      <男主人设 + 感情发展逻辑 + 至少一个名场面设计>

      ## 时代/地点
      <具体的时代背景、地理环境、物产特色>

      ## 主题
      <一句话精神内核>

    riff_requirements: |
      基于这个概念生成 5 个变体。保留核心构思中吸引人的部分，但将其推向不同的方向。

      确保这些变体之间有真正的区别——不要只是微调表面细节。
      可以改变的维度包括：时代背景、金手指类型、种田产业方向、男主人设、
      家庭关系结构、故事基调（温馨 vs 爽文 vs 细水长流）。

      按以下模板输出每个变体：

      # 创意<序号>：《<书名>》

      ## 不同之处
      <从原始种子中改变了什么，为什么要改变？>

      ## 作品简介
      <按照简介设计原则撰写，标签放在最前面，3-4段，短句为主，情绪炸裂>

      ## 核心卖点
      <一句话核心卖点>

      ## 开局困境
      <具体困境>

      ## 金手指与局限
      <金手指 + 局限性>

      ## 种田升级线
      <3-4个升级台阶>

      ## 人际困局
      <家庭 + 外部>

      ## 情感线
      <男主人设 + 感情逻辑 + 名场面>

      ## 时代/地点
      <具体背景>

      ## 爽点设计
      <最让读者拍案叫绝的"逆袭"时刻>

  world:
    requirements: |
      - 所有设定必须服务于"种田线"和"人际线"的推进
      - 经济数据必须自洽（收入与支出对得上，升级台阶在经济上合理）
      - 礼法规矩必须既能制造冲突、又能被女主用智慧突破
      - 地理物产必须能解释女主"为什么能在这里发家"
      - 每一条设定都要具体到可以直接用于写作的程度
      - 冰山原则：暗示的内容多于直接陈述的内容

    sections: |
      请按以下章节组织文档：

      ## 时代背景
      故事发生在什么朝代（或架空哪个朝代）？当前的政治大环境是什么？
      是太平盛世还是乱世初定？最近发生了什么影响底层百姓生活的大事？

      ## 经济体系
      ### 货币与物价
      列出核心物价清单（必须覆盖粮食、日用、住房、劳力、特殊品类）。
      ### 税赋与徭役
      ### 商业环境

      ## 社会阶层与礼法
      ### 阶层结构
      ### 婚姻与家族
      ### 女性地位
      ### 官府与法律

      ## 地理与物产
      ### 核心地点
      ### 物产与资源
      ### 感官特征

      ## 民俗与日常生活
      ### 饮食
      ### 服饰与住房
      ### 节气与习俗
      ### 医疗与卫生

      ## 关键 NPC 与势力（非主角团）

      ## 内部一致性规则（作者不可违反）

  characters:
    requirements: |
      ### 核心驱动力框架
      每个主要角色都必须有清晰的驱动力链条：
        处境 (SITUATION) → 她/他最迫切想要什么？(WANT)
          → 她/他真正需要什么？(NEED，通常与 WANT 矛盾)
          → 她/他心底的错误信念是什么？(LIE，阻碍她/他的心结)
          → 她/他的弧光走向 (ARC，LIE 被打破或强化的过程)

      ### 对话辨识度（6 个维度，适配种田文）
      1. 用词习惯：文雅/粗俗/口头禅/地方俗语
      2. 句子长短：碎嘴啰嗦型还是惜字如金型？
      3. 说话语气：阴阳怪气/直来直去/绵里藏针/嘴硬心软
      4. 口头禅/语言癖好
      5. 隐喻来源：种田人用庄稼比喻、织女用布匹比喻、商人用银子比喻
      6. 潜台词能力：话里有话还是有话直说？

      ### 人物关系网（种田文核心）
      种田文的戏剧张力大量来自人际关系。每个角色都必须：
      - 与至少 2 个其他角色存在利益冲突或情感纠葛
      - 有至少 1 个可能在故事中发生转变的关系

    role_types: |
      请从种子概念中提取所有涉及的角色，并为每个角色构建完整档案。
      通常一部种田文需要以下角色类型（根据种子概念调整具体人物）：

      ### 1. 女主（主角，视角人物）—— 最高优先级
      ### 2. 男主 —— 高优先级
      ### 3. 核心对手（家庭内部）—— 高优先级
      ### 4. 外部势力对手 —— 中优先级
      ### 5. 助力型配角 —— 中优先级
      ### 6. 氛围型配角 —— 低优先级

  outline:
    structure: |
      ### 整体结构（四幕式，适配种田文节奏）

      **第一幕：开局困境（约 1-5 章，占全书 0-22%）**
      - 建立女主的处境：穿越/重生后面对的具体困境
      - 展示金手指的首次使用（但受限）
      - 初步的人际冲突爆发（分家、被刁难、被看不起）
      - 催化事件：迫使女主必须靠自己种田/经营谋生的转折点
      - 男主的首次出场（自然，不刻意）

      **第二幕上：初步立足（约 6-11 章，占全书 22-48%）**
      - 种田线第一台阶→第二台阶的推进
      - 女主凭本事赢得初步认可（但也招来嫉妒）
      - 情感线破冰：从陌生/戒备到产生好感
      - 第一次打脸（小爽点）
      - 中点反转（约 48%）

      **第二幕下：遭遇打压（约 12-17 章，占全书 48-75%）**
      - 女主事业做大，引来外部势力打压
      - 家庭内部矛盾激化
      - 情感线推进：并肩作战中感情升温
      - 低谷时刻（约 70%）

      **第三幕：逆袭与收获（约 18-24 章，占全书 75-100%）**
      - 女主用智慧和积累反击，化危为机
      - 大打脸（核心爽点）
      - 种田线达到第四台阶（事业巅峰）
      - 情感线明朗化
      - 大结局

    constraints: |
      1. **种田线不能断**：不能连续 3 章以上没有种田/经营内容的推进。
      2. **情感线自然推进**：男女主不能一见钟情，必须有"日久生情"的过程。
      3. **经济逻辑自洽**：女主的每一笔收入和支出必须符合 world.md 中的物价体系。
      4. **打脸必须有铺垫**：每个打脸/逆袭场景之前，必须有至少 1-2 章的"被欺负"铺垫。
      5. **章尾钩子必须有**：每一章的结尾都必须留下悬念或期待感。
      6. **节奏张弛有度**：不能连续 3 章以上都是高强度冲突。
      7. **季节和农时对应**：故事中的时间推进必须与 world.md 中的农作物周期对应。
      8. **配角不是工具人**：极品亲戚每次出场都不能只是"来找麻烦"。
      9. **金手指使用有节制**：金手指不能每章都用，不能每次都完美解决问题。

    ledgers: |
      ### 种田升级台账
      | 台阶 | 内容 | 起始章 | 完成章 | 标志性事件 | 经济变化 |

      ### 情感线进度台账
      | 阶段 | 描述 | 章节范围 | 标志性名场面 |

      ### 伏笔台账
      | 线索 | 植入 (章) | 强化 (章) | 回收 (章) | 类型 |

      ### 打脸/爽点台账
      | 爽点 | 章节 | 被打脸的人 | 爽点描述 | 铺垫章节 |

  canon:
    sections: |
      ## 经济与物价
      ## 地理与环境
      ## 时间线
      ## 金手指规则
      ## 角色事实
      ## 社会礼法
      ## 民俗与日常
      ## 内部一致性规则

  chapter_draft:
    genre_specific_detail: |
      种田/经营细节要具体有质感——工序、手感、气味、算账都要写出来。

# ── Evaluation ──
evaluation:
  foundation:
    dimensions:
      economic_system:
        label: "经济体系"
        weight_group: "setting"
        description: "物价清单是否完整自洽？女主每笔收支能否在物价表中找到依据？经济升级速度是否合理？"
      social_rules:
        label: "社会礼法"
        weight_group: "setting"
        description: "婚姻、分家、女性地位等规则是否明确？是否既能制造冲突又留有突破口？"
      geography_products:
        label: "地理物产"
        weight_group: "setting"
        description: "地点是否有独特感官特征？物产是否与种田线直接相关？"
      cheat_rules:
        label: "金手指规则"
        weight_group: "setting"
        description: "能力边界是否清晰？局限性和冷却期是否明确？代价是否驱动情节？"
      farming_progression:
        label: "种田升级线"
        weight_group: "structure"
        description: "升级台阶是否清晰、可见、有代价？经济数据是否与world.md匹配？"
      face_slap_setup:
        label: "打脸铺垫"
        weight_group: "structure"
        description: "每个打脸/爽点是否有至少1-2章的铺垫？"
    cross_checks:
      - "经济数据交叉验证：物价、收入、支出是否自洽？女主的种田升级速度是否合理？"
      - "角色对话检查：不同角色是否共享相同句式？去掉标签能分辨谁在说话吗？"
      - "季节农时检查：故事时间线是否与农事周期对应？"
      - "金手指规则检查：局限性、冷却期是否明确？是否有规避不写的漏洞？"
      - "文档间矛盾检查：交叉对比年龄、地点、物价、关系。"
    weights:
      setting: 0.35
      character: 0.25
      structure: 0.30
      craft: 0.10

  chapter:
    dimensions:
      lore_integration:
        label: "设定整合度"
        description: "种田/经营细节在本章中是否有实质作用？"
      emotional_payoff:
        label: "情感回报"
        description: "本章是否有至少一个情感爆发点（爽点/心动/委屈/感动）？"

# ── Reader Personas ──
reader_personas:
  genre_reader: |
    你是一个每年阅读上百部网文的资深读者，特别偏爱女频种田经营、宅斗和基建文。
    你在乎爽点是否密集、升级路线是否清晰、打脸是否痛快。你讨厌憋屈的剧情
    和无意义的虐主。你敏锐地察觉到节奏拖沓、升级停滞、或者反派降智的时刻。
    你喜欢看主角通过双手积累财富和地位的过程。你对喜欢的情节毫不吝啬赞美，
    对无聊的桥段也会直言不讳。你只用有效的 JSON 格式回复。
  writer: |
    你是一位出版过五部畅销种田文的资深网络小说作家。
    你从手艺人的角度阅读。你关注结构：情节节拍落点在哪里，伏笔是否回收，
    角色弧光是否完整，金手指的设定是否平衡且有局限性。你关注作者的技法
    是刻意为之还是无缝融入故事中。你最看重的是'期待感'的建立与释放。
    你在乎小说设定与实际呈现之间的差距。你只用有效的 JSON 格式回复。

# ── Voice Template ──
voice_template:
  tone_hint: |
    种田文的基调参考：
    "有烟火气的温暖。像冬天坐在灶台边听隔壁大娘讲八卦，
     手里剥着瓜子，偶尔被呛到。"
    "先苦后甜的踏实。文字像手里的活计——一针一线看得见。"
    "不矫情、不煽情，但该扎心的时候一句话扎到骨头里。"
  sentence_rhythm_hint: |
    "日常场景用松散的、带着口语感的中长句。
     情感爆发用短句。对话干脆利落，不拖泥带水。"
    "种田/经营段落允许详细描写（工序、手感、气味），
     但人际冲突段落要快，像吵架一样来回打。"
  vocabulary_hint: |
    禁用现代词汇（比如"效率""流量""赋能"）。
    使用古代日常口语，但不要文言文。
    农具、织具、食材、布料的专业术语要准确。
    人物称呼要符合身份（大伯、婶娘、掌柜的、小姐、姑娘等）。
  pov_hint: |
    种田文通常使用第三人称有限视角、过去时态，
    紧紧跟着女主的所见所闻所想。
  exemplar_scenes:
    - "一段种田/经营场景（有工序细节、有身体感受）"
    - "一段家庭冲突场景（有对话交锋、有情绪暗流）"
    - "一段情感暗涌场景（有心动描写、有克制、有日常感）"
    - "一段集市/社交场景（有烟火气、有人情世故）"
    - "一段逆袭/爽点场景（有打脸、有扬眉吐气、但不过火）"

# ── Mystery Template ──
mystery_template: |
  <!-- 种田文的悬念通常与人物身份、利益格局相关。
  常见类型：
    - 男主的隐藏身份及真正目的
    - 女主金手指的来源有更深的秘密
    - 某个角色看似无害实则心怀叵测
    - 一笔被遗忘的遗产或债务
    - 一桩被掩盖的旧案 -->
