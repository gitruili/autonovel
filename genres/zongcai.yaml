  volume_plan:
    split_requirements: |
      ## 拆分故事线分卷要求
      1. 主线目标拆分为多个阶段性目标（如从实习生到总监，从边缘人到集团掌权人）。
      2. 女主职场地位/社会阶层/豪门话语权跃迁；男女主情感进度（如相识、试探、暧昧、动心、生死考验、交心）。
      3. 切换舞台，改变主活动区域（如从底层部门到总裁办，从国内市场到海外并购，从普通酒会到顶级财阀内部会议）。
      4. 核心矛盾/主要敌人（恶毒女配、家族夺权的长辈、商业竞争对手）阶段性解决。
      5. 主角身份反转或马甲掉落（如神秘黑客、顶尖设计师、真千金身份曝光、神秘财阀继承人）。

    design_principles: |
      ## 分卷设计原则
      1. 分卷开头 vs 结尾，女主的财富、地位、话语权、名声以及与男主的情感深度需要发生巨大改变，提供显著升级感与爽感。
      2. 每卷开头设定清晰的核心目标（如拿下一个不可能的案子、在名媛宴会上反击），围绕目标规划情节，设置相应冲突/挑战、实现路径、支线（最终要回馈主线）。
      3. 每卷结尾的成果/成就可视化，可能是职场晋升（拿到股份）、惊艳的公开亮相、获得关键底牌（录音、证据）、感情突破（同居、表白、订婚、领证）。
      4. 主角爱情线、亲情线、友情线升级或变化，闺蜜的助力、男主的暗中护航或强强联手将成为女主事业发展的动力，融入日常支线（最终回馈主线）。
      5. 每卷必须出现新资源（人脉、资金）、新项目、新敌人（更高级别的绿茶或商战对手）中至少其一。

    structure_requirements: |
      ## 分卷结构（五段式，适配总裁豪门文）

      ### 1. 开局挑战
      - 衔接前文快速切入本卷新场景/新身份（如空降新部门、被迫搬进男主家），平滑引入新的冲突/挑战。
      - 立刻遇到一个紧迫的麻烦（如刚接手就被设局的烂摊子项目、被恶毒女配当众刁难、家族债务催收等）。
      - 确立本卷的阶段性目标、核心问题（洗清冤屈？证明实力？反击？）和要达成的主要成就。

      ### 2. 发展与探索
      - 解决开局的小危机，稳定基本盘，展现女主的聪明才智或独特魅力。
      - 一系列小的冲突事件，逐步揭开豪门背后的隐秘、职场的暗流。女主与男主在此过程中产生交集、误会、试探与暧昧拉扯。
      - 女主的事业/计划在主导下量变提升，穿插小成功（如打脸小反派、化解小危机）维持读者期待感。
      - 矛盾积累/新危机浮现：女主的光芒触动了旧利益格局（如白月光回国、家族长辈出手施压），内部也可能出现信任危机或流言蜚语。

      ### 3. 冲突升级
      - 敌对势力从暗中使绊子转向明面上的实质性攻击（如造谣网暴、商业泄密栽赃、设计致命陷阱）。
      - 男女主之间可能因外界压力或阴谋产生拉扯，但随后走向极致信任与联手。
      - 女主应对与力量展现，将前期的积累（暗中收集的证据、结交的大佬人脉、男主提供的资源平台）转化为反击利器，将计就计，借力打力，体现大女主智谋。
      - 关键事件（如年度股东大会、巅峰发布会、世纪订婚宴）爆发，核心冲突进入高潮。

      ### 4. 高潮：解决核心矛盾
      - 激烈的交锋，面临全网黑或被彻底赶出家族/公司的绝境边缘。
      - 女主运用所有底牌，在众目睽睽之下完美翻盘，彻底撕破反派的伪装，将敌人送进监狱或让其身败名裂（最大的爽点爆发）。
      - 胜利的根源必须清晰地归结到前期的伏笔和积累上（如女主隐藏的马甲、暗中收购的散户股份、男主天衣无缝的配合），这是最大爽点——让读者回味前文中的每一步布局。
      - 获得丰厚战利品（股份、总裁位置、行业话语权）、巨大声望提升，以及男主毫无保留的偏爱与公开承认。

      ### 5. 整合与钩子
      - 盘点收获，名声地位大涨，反派受到惩罚，感情升温（发糖/高甜时刻）。
      - 新钩子：被更庞大的家族势力盯上、牵扯出当年车祸/身世的更大谜团、或者男主家族抛出的终极考验，开启新地图。

    output_template: |
      ## 卷纲输出模板
      请先按以下模板输出本卷的宏观骨架，再展开逐章大纲：

      **卷<序号> <标题>**
      **舞台环境** ：（如某某跨国集团总部、顶级名媛社交圈、海外并购战场等）
      **阶段目标** ：（本卷女主要达成的核心目标）
      **阶段成长** ：（从 XX 状态→YY 状态，量化变化：职位/股份/声望/情感）
      **剧情概要** ：
      1. （开局挑战：XX）
      2. （发展探索：XX）
      3. （冲突升级：XX）
      4. （高潮：XX）
      5. （整合与钩子：XX）

    # ── 术语分层定义 ──
    terminology: |
      ## 术语定义（请严格遵守粒度边界）
      - **总纲**：整部作品的故事线设计与设定框架（多卷，2500+章级别）。
      - **卷纲**：分卷大纲，每卷约 20 章的宏观故事梗概（你在本阶段生成的是卷纲骨架，不是细节章纲）。
      - **章纲**：单章故事梗概，必须包含冲突—发展—转折—钩子的完整因果链（你在逐章大纲部分生成的是章纲）。
      - **前文**：已发生的情节，用于衔接上下文。本章不能与前文矛盾。
      - **单剧情**：包含挑战到解决的完整闭环（通常跨越 2-4 章，不是单章内完成一切）。

    # ── 总裁豪门冲突设计脚手架 ──
    conflict_patterns: |
      ## 冲突设计原则（总裁豪门文适用）
      
      ### 冲突预示铁律
      1. 所有重大冲突爆发前必须有至少 2-3 章的铺垫——仇恨积累和实力此消彼长的过程。
      2. 冲突无处不在：明面（董事会交锋、发布会对质、媒体战）、暗地（商业间谍、股权秘密收购、舆论操纵）、暗示性（眼神、沉默、一个看似无意的"偶遇"）。
      3. 利益与情感优于单纯对抗：一场收购战的核心不是谁出价更高，而是谁掌握了对方的软肋。一场名媛宴会的交锋不是谁穿得更贵，而是谁一句话让对方下不来台。
      
      ### 商战对决策略（可选用 1-2 种注入章纲）
      - **将计就计**：故意示弱让对方以为胜券在握，在关键时刻用提前埋好的底牌翻盘。
      - **围魏救赵**：在 A 战场被动时，猛攻对方必救的 B 战场，迫使对方回防。
      - **声东击西**：公开炒作一个虚假的大动作（如宣布进军某领域），掩盖真正的杀招（如暗中收购核心供应商）。
      - **借刀杀人**：不直接对抗，而是把对手的敌人、媒体的注意力、监管的力量引向对方。
      - **欲擒故纵**：故意给对方一个"机会"，让对方自己走进陷阱。
      - **釜底抽薪**：不正面交锋，而是切断对方的关键资源（资金链、核心人才、独家供应）。
      
      ### 豪门博弈策略
      - **借势压人**：用更高层的人脉或规矩反制对方（如"这件事，老爷子知道吗？"）。
      - **以退为进**：主动放弃某个利益，换取道德制高点或更大的战略空间。
      - **身份反转**：当对方以身份压人时，亮出一个让对方意想不到的身份或底牌。
      - **规矩反制**：利用家族规矩中对方忽略的条款，反过来限制对方。
      
      ### 情感推拉策略
      - **单向破例**：男主在所有人面前冷酷，唯独在女主面前露出柔软一面。
      - **极限拉扯**：一方靠近一步，另一方因心结退后半步，循环中感情升温。
      - **吃醋而不说**：男主看到女主和别人亲近，表面不动声色，但一个细节出卖了他的在意。
      - **危难中的唯一**：在最危险的时刻，男主不顾一切站到女主身边，用行动而非语言确认感情。

      ### 总裁豪门爽点类型（每章至少含 1 种）
      - **打脸爽**：曾经看不起女主的人被事实狠狠打脸。关键：打脸之前必须有充分的"被看不起"铺垫。
      - **掉马爽**：女主的隐藏身份/能力在关键时刻曝光，众人大惊。关键：掉马时机要精准——在最需要的时候、在最多人在场的时候。
      - **护短爽**：男主/家族在众人面前公开维护女主，让所有质疑者闭嘴。
      - **迪化爽**：旁观者（同事、对手、路人）被女主的能力/魅力震撼，产生"她到底是什么人"的敬畏感。
      - **破防爽**：一直高高在上/冷漠的角色被女主某个举动触动，露出真实情感。
      - **碾压爽**：女主用专业能力在正面竞争中完胜对手，让对方输得心服口服。
      - **反转爽**：看似走投无路的局面，因为前文埋下的伏笔瞬间逆转。
      - **苏感爽**：男主一个眼神、一句话、一个动作让读者心跳加速——冷酷外壳下的温柔瞬间。
      
      ### 炸弹理论（每 3-5 章埋一个）
      - 远期炸弹：一个巨大的潜在威胁（如某个幕后黑手的存在、一个致命秘密的线索），让读者知道"风暴即将来临"。
      - 近期炸弹：一个即将在本卷内引爆的危机（如一场必须赢的竞标、一个即将公开的丑闻）。

    # ── 章纲详细输出模板 ──
    chapter_output_template: |
      ## 逐章大纲格式（严格按此格式，每章约 200-300 字）

      不使用"关键场景: 3-5 个"的写法，改用**编号剧情点**链式结构。
      每个剧情点直写内容，不带"发生什么""为什么好看""推动什么"等分析标签——叙事本身隐含因果。

      ---

      ### 第 N 章: [网文感标题，能勾起好奇心]

      **核心冲突** （一句话：本章谁和谁的什么在碰撞？什么利益/情感/身份在对抗？）

      **核心推进:** 本章主要推进哪条线？（事业线 / 情感线 / 权力线 / 悬念线 / 人际线）
      **地点:** 具体的场景地点
      **情绪走向:** 开头情绪 → 结尾情绪

      **剧情点 1（[情绪标签: 危机/铺垫/试探/反差/温馨/紧张]）**
      [场景内容。直写剧情，不用引导词。写清楚谁在哪里做了什么、结果是什么。]

      **剧情点 2（[情绪标签]）**
      [承接上一节的因果展开。写清楚与前一个剧情点的关联。]

      **剧情点 3（[爽点类型: 打脸/掉马/护短/迪化/破防/碾压/反转/苏感]）**
      [本章的情绪高潮。确保此处的冲击力来自前两个剧情点的铺垫。]

      **剧情点 4（[情绪标签: 余波/暗流/新危机/情感沉降]）**
      [高潮后的收尾或转折，为钩子做好铺垫。]

      **章尾钩子** （必须是一个具象事件或信息，让读者必须翻下一章）
      - 正确示例："助理冲进会议室，脸色煞白：'陆总，那批货在海关被扣了。'"
      - 错误示例："更大的风暴正在酝酿。"

      **升级进展:** 本章女主的地位/事业/资产有什么具体推进？
      **情感进展:** 本章感情线（女主×男主）有什么变化？
      **人际变动:** 本章哪些人际关系发生了转变？
      **伏笔植入:** 本章埋下了什么新线索？
      **伏笔回收:** 本章回收了哪个之前埋下的伏笔？
      **爽点/虐点:** 本章的读者情绪高点是什么？
      **~目标字数:** 预估本章字数
  # 用于 gen_master_outline.py 的总纲生成增强
  master_outline:
    volume_design_principles: |
      ## 卷级设计增强原则（总裁豪门文适配）

      在设计每一卷的概览时，请遵循以下原则：

      ### 舞台切换
      每 2-3 卷切换一次主要活动舞台（如从公司内部→豪门大宅→海外市场→行业峰会），
      避免长期停留在同一场景导致读者审美疲劳。

      ### 阶段性成长 KPI
      每卷必须明确女主在以下维度的量化变化（至少标注其中 3 项）：
      - 职位/头衔变化（如实习生→项目经理→副总裁→CEO）
      - 股份/资产变化（如 0%→5%→15%→控股）
      - 社会声望变化（如无名小卒→行业新星→商界女王）
      - 情感阶段变化（如陌生→暧昧→确认→考验→相守）
      - 豪门话语权变化（如外人→被接纳→核心决策层）

      ### 新元素注入
      每卷必须引入以下至少其一，避免读者感到重复：
      - 新资源（新的人脉圈层、关键资金来源、技术/信息优势）
      - 新项目/新商战（跨国并购、IPO、品牌发布会等更大舞台）
      - 新敌人（更高级别的绿茶/商战对手/家族内部隐藏势力）

      ### 爽点归因原则
      每卷高潮的胜利必须清晰归因到前期"积累"：
      - 是前几卷暗中收集的证据/录音扳倒了对手
      - 是悄悄布局的股权收购在关键时刻翻盘
      - 是长期经营的人脉在危机时伸出援手
      - 是男主前期"不经意"的帮助在此刻爆发为全力护航
      读者在高潮时应产生"原来前面那些铺垫都是为了这一刻！"的快感。

      ### 成果可视化
      每卷结尾必须有明确的"盘点收获"时刻，让读者感受到女主的阶段性胜利：
      - 具体的数字（股份从X%涨到Y%、公司市值翻了N倍）
      - 具体的身份变化（从XX部门调到YY岗位、正式进入家族核心圈）
      - 具体的情感突破（从暧昧到表白、从对立到并肩）
      - 反派的具体下场（被开除/被揭穿/破产/坐牢）

# ── Evaluation ──
evaluation:
  foundation:
    dimensions:
      # ── SETTING (设定与世界观) — 30% ──
      business_system:
        label: "商业体系"
        weight_group: "setting"
        description: "公司治理结构是否合理？股权比例、交易金额是否自洽？商战逻辑是否符合商业常识？"
      family_structure:
        label: "豪门家族结构"
        weight_group: "setting"
        description: "家族谱系是否清晰？继承权、嫡庶关系是否明确？家族规矩是否既能制造冲突又留有突破口？"
      urban_setting:
        label: "都市环境"
        weight_group: "setting"
        description: "城市设定是否真实？高端消费、社交圈层是否有具体描写？是否服务于情节推进？"
      cheat_rules:
        label: "金手指规则"
        weight_group: "setting"
        description: "能力边界是否清晰？局限性和风险是否明确？代价是否驱动情节？"
      # ── CHARACTER (角色) — 30% ──
      protagonist_depth:
        label: "主角设定深度"
        weight_group: "character"
        description: "【依据 characters.md 核心角色档案】: 主角设定是否覆盖外貌/声线/衣品/行事风格/家庭关系/情感模式等完整维度？是否遗漏关键信息？驱动力链条和弧光规划是否清晰可信？"
      supporting_anchoring:
        label: "配角锚定质量"
        weight_group: "character"
        description: "【依据 characters.md 配角档案】: 每个配角的设定是否扎根于'与主角的关系'这个锚点？功能定位是否比性格描述更优先？是否有纯粹悬浮的、与主角无关的角色？"
      character_voice:
        label: "角色辨识度"
        weight_group: "character"
        description: "【依据 characters.md 对话辨识度】: 不同角色是否有独特的说话方式？去掉标签能分辨谁在说话吗？口头禅和语言癖好是否与人物身份匹配？"
      relationship_network:
        label: "人际关系网络"
        weight_group: "character"
        description: "【依据 characters.md 关系网】: 角色之间是否形成足够的利益冲突和情感纠葛？是否有1条以上会转变的关系线？特殊人物是否有明确的功能边界？"
      villain_rotation:
        label: "反派轮换设计"
        weight_group: "character"
        description: "【依据 master_plan.antagonist_rotation + characters.md 反派轮换表】: 反派梯队是否分层？退场-引入节奏是否合理？每个反派是否有独特动机和退场方式？"
      # ── STRUCTURE (结构) — 30% ──
      upgrade_progression:
        label: "升级台阶"
        weight_group: "structure"
        description: "【依据 master_plan.economy_milestones + world.md】: 升级台阶是否清晰、可见、有代价？每个台阶是否有具体的商业事件支撑？经济数据是否自洽？"
      volume_structure:
        label: "分卷结构"
        weight_group: "structure"
        description: "【依据 master_plan.volumes】: 每卷是否有独立的核心冲突、高潮和阶段性胜利？卷间是否有递进关系？全书节奏曲线是否合理？日常卷是否有内在情感张力？"
      payoff_setup:
        label: "爽点铺垫"
        weight_group: "structure"
        description: "【依据 outline 第一卷 + master_plan】: 每个打脸/爽点是否有充分的铺垫？关键爽点的达成路径是否在总纲中有足够展开？爽点密度是否合理？"
      foreshadowing_balance:
        label: "伏笔平衡"
        weight_group: "structure"
        description: "【依据 master_plan.long_foreshadows + outline】: 伏笔台账是否存在？长线/中线/短线伏笔是否平衡？植入到回收的间隔是否合理？是否有中途可回收的中线伏笔？"
      expansion_roadmap:
        label: "扩展路线图"
        weight_group: "structure"
        description: "【依据 master_plan + world.md Part B】: 世界观是否预留了足够的扩展空间？后续卷的设定扩展是否有明确规划？新兴市场/势力是否有预置的复杂角色？"
      face_slap_setup:
        label: "打脸铺垫"
        weight_group: "structure"
        description: "每个打脸/爽点是否有至少1-2章的铺垫？"
    cross_checks:
      - "商业数据交叉验证：股权比例、交易金额、资产规模、收入量级是否自洽？"
      - "角色对话检查：不同角色是否共享相同句式？去掉标签能分辨谁在说话吗？"
      - "主角设定完整性检查：是否遗漏了身高/声线/衣品/行事风格/家庭关系/情感模式等关键维度？"
      - "配角锚定检查：每个配角是否都有明确的'对主角意味着什么'的答案？"
      - "特殊人物功能边界：师父/前辈/幕后大佬是否功能边界清晰？会不会变成万能救场工具？"
      - "金手指规则检查：局限性、冷却期是否明确？是否有规避不写的漏洞？"
      - "文档间矛盾检查：交叉对比年龄、地点、资产、关系、时间线。"
    weights:
      setting: 0.30
      character: 0.30
      structure: 0.30
      craft: 0.10

  chapter:
    dimensions:
      elite_integration:
        label: "豪门感整合度"
        description: "豪门/商界细节在本章中是否有实质作用？是否有都市精英的氛围？"
      emotional_payoff:
        label: "情感回报"
        description: "本章是否有至少一个情感爆发点（爽点/心动/委屈/感动）？"

# ── Reader Personas ──
reader_personas:
  genre_reader: |
    你是一个每年阅读上百部网文的资深读者，特别偏爱女频总裁豪门、甜宠和虐恋文。
    你在乎男主是否够苏、身份落差的反转是否痛快、甜宠互动是否让人心跳加速。
    你讨厌没有逻辑的"霸道"和无脑的"宠"。你敏锐地察觉到人设崩塌、节奏拖沓、
    或者商战写得太假的时刻。你喜欢看冷漠总裁为女主一个人破例的心动瞬间，
    也喜欢看被轻视的女主逆袭打脸的爽感。你对喜欢的情节毫不吝啬赞美，
    对无聊的桥段也会直言不讳。你只用有效的 JSON 格式回复。
  writer: |
    你是一位出版过五部畅销总裁豪门文的资深网络小说作家。
    你从手艺人的角度阅读。你关注结构：情节节拍落点在哪里，伏笔是否回收，
    角色弧光是否完整，商战逻辑是否自洽。你关注作者的技法
    是刻意为之还是无缝融入故事中。你最看重的是"期待感"的建立与释放——
    男主的苏感、女主的成长、身份反转的时机。你在乎小说设定与实际呈现之间的差距。
    你只用有效的 JSON 格式回复。

# ── Voice Template ──
voice_template:
  tone_hint: |
    总裁豪门文的基调参考：
    "都市精英感。像在CBD顶层的落地窗前喝威士忌，
     窗外是万家灯火，杯中是权力与欲望。"
    "冷硬外壳下的柔软。文字像总裁的西装——表面笔挺克制，
     但领带松开的那一刻，才露出真实的温度。"
    "张弛有度的推拉。该冷的时候冷到骨头里，
     该甜的时候一句话让人心跳加速。"
  sentence_rhythm_hint: |
    "商战场景用短促有力的句子，像交锋一样来回打。
     甜蜜场景用细腻的中长句，放慢节奏让读者沉浸。
     豪门冲突场景用快节奏的对话，暗藏机锋。"
    "总裁说话惜字如金，一个字能说完的不用两个字。
     女主内心独白可以丰富，但外在表现要克制。"
  vocabulary_hint: |
    禁用古代词汇（比如"夫君""娘子""小姐"）。
    使用现代都市精英用语。注意不同身份的用语差异：
    总裁：简短有力、商业术语、偶尔英文
    豪门太太：优雅得体、暗含机锋
    职场人：专业术语、KPI、deadline
    闺蜜：直爽、网络用语、八卦语气
    高端品牌名、商业术语要准确（不要把"尽职调查"写成"调查"）。
  pov_hint: |
    总裁豪门文通常使用第三人称有限视角、过去时态，
    紧紧跟着女主的所见所闻所想。男主视角可以偶尔切入，
    但要控制比例（不超过20%），保持男主的神秘感。
  exemplar_scenes:
    - "一段商务谈判场景（有交锋、有博弈、有暗流涌动）"
    - "一段豪门宴会场景（有身份碰撞、有社交潜规则、有意外事件）"
    - "一段甜蜜互动场景（有心动描写、有推拉、有身份反差的萌感）"
    - "一段打脸逆袭场景（有铺垫、有爆发、有扬眉吐气、但不过火）"
    - "一段身份揭露场景（有震撼、有反转、有全场哗然的爽感）"

# ── Mystery Template ──
mystery_template: |
  <!-- 总裁豪门文的悬念通常与身份、商业阴谋、家族秘密相关。
  常见类型：
    - 男主的隐藏身份或不为人知的过去（童年创伤/前任纠葛/身体隐疾）
    - 女主的真实身世（落魄千金/隐藏大佬/与豪门的隐秘关联）
    - 商业阴谋（恶意收购/商业间谍/股权争夺中的暗手）
    - 家族秘密（私生子/遗产纠纷/被掩盖的丑闻）
    - 白月光的真实目的（并非真爱而是另有图谋）
    - 契约/替嫁背后的真正推手 -->
