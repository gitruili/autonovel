# ── Prompt Fragments ──
prompt_fragments:
  seed:
    generate_requirements: |
      ## 每个概念必须包含以下要素

      ### 开局困境
      女主一开始面临的具体困境是什么？要有画面感和紧迫感。
      好例子："醒来发现自己穿成了总裁文里的替嫁新娘，原主刚被赶出豪门，兜里两百块，外面下着大雨。"
      坏例子："穿越到现代生活很艰难。"（太笼统）

      ### 都市/豪门背景
      具体的城市和豪门环境。不要只说"现代都市"，要明确到什么样的城市（一线/二线）、
      什么样的豪门（老牌世家/新晋财阀/隐形富豪）、
      什么样的商业帝国（地产/科技/金融/医药）。
      体现出"这个家族"独有的规矩和权力结构。

      ### 金手指
      女主的核心优势是什么？可以是：
        - 前世记忆（重生文：知道未来商战走向和家族秘密）
        - 穿书记知（穿书文：知道原书剧情，可以避坑）
        - 特殊技能（商业天赋、医术、设计才能、黑客技术等）
        - 隐藏身份（落魄千金/隐藏大佬/马甲满身）
        - 或者纯粹靠智商和性格（无金手指硬核总裁文）
      关键：金手指必须有局限性（比如重生记忆只到某个时间点、穿书剧情已经偏移、
      隐藏身份有曝光风险），不能让女主无所不能，否则没有戏剧张力。

      ### 升级线/逆袭线
      女主的核心逆袭路线是什么？要具体到阶段，并且设计出3-4个升级台阶。
      好例子："被赶出豪门的小职员→靠能力进入对手公司→创业成为商界新星→收购前夫公司→成为真正的豪门女王"
      坏例子："嫁入豪门过好日子。"（太笼统）
      升级线是故事的骨架，每个台阶都应该对应一个爽点爆发和新的挑战。

      ### 人际困局
      女主面临的人际关系核心矛盾是什么？
        - 豪门内部：刻薄婆婆、心机妯娌、争家产、嫡庶之争等
        - 外部势力：商业对手、前女友/白月光、媒体舆论等
        人际线和升级线必须互相咬合——比如事业做大了反而招来豪门内部的打压。

      ### 情感线
      男主是谁？他的人设亮点是什么？他和女主的感情发展逻辑是什么？
      男主是总裁/继承人，但不能是脸谱化的"霸道总裁"——必须有自己的心结或困境
      （童年创伤、家族压力、前任阴影、身体隐疾等）。
      感情线要有"日久生情"的真实感——从契约/对立到互相了解到心动。
      要设计至少一个"名场面"（让读者截图分享的心动瞬间）。

      ### 主题
      这个故事的精神内核是什么？
      好例子："一个人的价值，到底是由出身定义，还是由自己定义？"
      坏例子："嫁入豪门就是成功。"（太说教）

    diversity_requirements: |
      ## 多样性要求
      确保这 {count} 个概念具有多样性：
        - 至少有一个契约婚姻流（重心在假戏真做的过程）
        - 至少有一个替嫁/替身流（重心在身份错位和真相揭露）
        - 至少有一个重生复仇流（重心在逆袭打脸和商战博弈）
        - 至少有一个穿书改命流（重心在已知剧情的蝴蝶效应）
        - 至少有一个隐婚/马甲流（重心在身份揭露的爽感）
        - 混合不同基调：甜宠治愈、虐恋情深、爽文逆袭、细水长流

    prohibitions: |
      ## 禁止生成
        - 男主是完美无缺的"纸片人霸总"（必须有心结和成长弧光）
        - 女主是只会哭的"小白花"（必须有独立人格和核心能力）
        - 金手指没有任何限制、女主无所不能的"躺赢"设定
        - 所有配角都是坏人/所有好人都帮女主的黑白脸谱化
        - 忽略现代法律和商业逻辑的"伪豪门文"（公司治理、股权结构要合理）
        - 纯虐文或BE结局（总裁豪门文的核心是"真爱战胜一切"的希望感）
        - 男主对女主的控制/暴力行为被美化（要区分"霸道"和"违法"）
        - 穿越时空的古代词汇和行为方式

    output_template: |
      ## 输出模板（严格按此格式）

      # 创意<序号>：《<书名>》

      ## 作品简介
      <按照简介设计原则撰写，标签放在最前面，3-4段，短句为主，情绪炸裂>

      ## 核心卖点
      <一句话描述核心卖点/核心梗：女主走上怎样的逆袭之路？最大的爽点是什么？>

      ## 开局困境
      <具体的、有画面感的起始困境>

      ## 金手指与局限
      <金手指是什么？局限性是什么？风险是什么？>

      ## 升级线/逆袭线
      <3-4个升级台阶，每个台阶对应的商战/身份变化、爽点和挑战>

      ## 人际困局
      <豪门内部矛盾 + 外部势力矛盾>

      ## 情感线
      <男主人设 + 感情发展逻辑 + 至少一个名场面设计>

      ## 都市/豪门背景
      <具体的城市、豪门家族、商业帝国>

      ## 主题
      <一句话精神内核>

    riff_requirements: |
      基于这个概念生成 5 个变体。保留核心构思中吸引人的部分，但将其推向不同的方向。

      确保这些变体之间有真正的区别——不要只是微调表面细节。
      可以改变的维度包括：城市背景、豪门类型（老牌vs新晋）、金手指类型、
      升级路线、男主人设、家庭关系结构、故事基调（甜宠vs爽文vs虐恋）。

      按以下模板输出每个变体：

      # 创意<序号>：《<书名>》

      ## 不同之处
      <从原始种子中改变了什么，为什么要改变？>

      ## 作品简介
      <按照简介设计原则撰写，标签放在最前面，3-4段，短句为主，情绪炸裂>

      ## 核心卖点
      <一句话核心卖点>

      ## 开局困境
      <具体困境>

      ## 金手指与局限
      <金手指 + 局限性>

      ## 升级线/逆袭线
      <3-4个升级台阶>

      ## 人际困局
      <豪门内部 + 外部>

      ## 情感线
      <男主人设 + 感情逻辑 + 名场面>

      ## 都市/豪门背景
      <具体背景>

      ## 爽点设计
      <最让读者拍案叫绝的"逆袭"时刻>

  world:
    requirements: |
      - 所有设定必须服务于"升级线"和"情感线"的推进
      - 商业数据必须自洽（公司估值、股权比例、交易金额合理）
      - 豪门规矩必须既能制造冲突、又能被女主用智慧突破
      - 都市环境必须真实（不能把一线城市写成小县城）
      - 每一条设定都要具体到可以直接用于写作的程度
      - 冰山原则：暗示的内容多于直接陈述的内容

    sections: |
      请按以下章节组织文档：

      ## 城市与商业环境
      故事发生在什么城市？这个城市的商业生态是什么？
      主要产业是什么？高端商圈在哪里？富人区在哪里？

      ## 商业体系
      ### 核心企业
      男主/女主/对手的企业是什么行业？规模多大？上市还是私有？
      ### 股权与治理
      公司的股权结构、董事会构成、决策机制。
      ### 商业竞争
      行业格局、主要竞争对手、市场环境。

      ## 豪门家族
      ### 家族结构
      族谱、辈分、嫡庶、旁系。谁是家主？谁有继承权？
      ### 家族规矩
      门第观念、联姻传统、家规家训、对媳妇/女婿的要求。
      ### 家族产业
      家族控制的核心资产、产业版图、财富规模。
      ### 权力格局
      家族内部的派系、利益联盟、核心矛盾。

      ## 社交圈层
      ### 上流社会
      名媛圈、商会、慈善晚宴、高尔夫俱乐部等社交场所的规矩。
      ### 媒体与舆论
      财经媒体、娱乐八卦、社交媒体对豪门的关注方式。

      ## 日常生活
      ### 居住环境
      豪宅/别墅/顶层公寓/老宅的描写。
      ### 高端消费
      品牌、餐饮、出行、服饰的时代特征。
      ### 感官特征
      皮质沙发、落地窗、红酒、高定西装、豪车等精英符号。

      ## 关键 NPC 与势力（非主角团）

      ## 内部一致性规则（作者不可违反）

  characters:
    requirements: |
      ### 核心驱动力框架
      每个主要角色都必须有清晰的驱动力链条：
        处境 (SITUATION) → 她/他最迫切想要什么？(WANT)
          → 她/他真正需要什么？(NEED，通常与 WANT 矛盾)
          → 她/他心底的错误信念是什么？(LIE，阻碍她/他的心结)
          → 她/他的弧光走向 (ARC，LIE 被打破或强化的过程)

      ### 对话辨识度（6 个维度，适配总裁豪门文）
      1. 用词习惯：文雅/粗俗/口头禅/商业术语/英文夹杂
      2. 句子长短：碎嘴啰嗦型还是惜字如金型？
      3. 说话语气：命令式/阴阳怪气/绵里藏针/温柔低沉
      4. 口头禅/语言癖好（注意身份差异：总裁的简短有力、豪门太太的优雅刻薄、闺蜜的直爽）
      5. 隐喻来源：商人用战争/棋局比喻、名媛用时尚比喻、职场人用KPI比喻
      6. 潜台词能力：话里有话还是有话直说？（总裁豪门文中潜台词极为重要）

      ### 人物关系网（总裁豪门文核心）
      总裁豪门文的戏剧张力大量来自人际关系。每个角色都必须：
      - 与至少 2 个其他角色存在利益冲突或情感纠葛
      - 有至少 1 个可能在故事中发生转变的关系
      - 身份地位和经济实力必须影响人物关系

    role_types: |
      请从种子概念中提取所有涉及的角色，并为每个角色构建完整档案。
      通常一部总裁豪门文需要以下角色类型（根据种子概念调整具体人物）：

      ### 1. 女主（主角，视角人物）—— 最高优先级
      ### 2. 男主（总裁/继承人）—— 高优先级
      ### 3. 豪门长辈（婆婆/公公/老太太）—— 高优先级
      ### 4. 白月光/前女友 —— 中优先级
      ### 5. 商业对手 —— 中优先级
      ### 6. 闺蜜/助理 —— 低优先级

  outline:
    structure: |
      ### 整体结构（四幕式，适配总裁豪门文节奏）

      **第一幕：开局困境（约 1-5 章，占全书 0-22%）**
      - 建立女主的处境：替嫁/契约/被赶出豪门后面对的具体困境
      - 展示金手指的首次使用（但受限）
      - 初步的人际冲突爆发（被婆家刁难、被前女友挑衅、被同事排挤）
      - 催化事件：迫使女主必须靠自己谋生或破局的转折点
      - 男主的首次出场（冷酷、疏离、但有某个细节暗示内心不同）

      **第二幕上：初步立足（约 6-11 章，占全书 22-48%）**
      - 升级线第一台阶→第二台阶的推进
      - 女主凭本事赢得初步认可（但也招来嫉妒）
      - 情感线破冰：从契约/对立到产生好感（某个意外事件让男主看到女主的不同）
      - 第一次打脸（小爽点：打脸前女友/刁难的同事）
      - 中点反转（约 48%）

      **第二幕下：遭遇打压（约 12-17 章，占全书 48-75%）**
      - 女主事业/身份做大，引来豪门内部打压
      - 商业对手介入，外部矛盾激化
      - 情感线推进：并肩作战中感情升温
      - 低谷时刻（约 70%）：误会/身份暴露/被迫分离

      **第三幕：逆袭与收获（约 18-24 章，占全书 75-100%）**
      - 真相大白，误会解开
      - 女主用智慧和积累化危为机
      - 大逆袭/大打脸（核心爽点）
      - 情感线明朗化：男主表白/承诺
      - 大结局

    constraints: |
      1. **升级线不能断**：不能连续 3 章以上没有升级/逆袭内容的推进。
      2. **情感线自然推进**：男女主不能一见钟情，必须有"日久生情"的过程。
      3. **商业逻辑自洽**：商战中的每一笔交易、每一个决策必须符合商业常识。
      4. **打脸必须有铺垫**：每个打脸/逆袭场景之前，必须有至少 1-2 章的"被欺负"铺垫。
      5. **章尾钩子必须有**：每一章的结尾都必须留下悬念或期待感。
      6. **节奏张弛有度**：不能连续 3 章以上都是高强度冲突。
      7. **豪门规矩要守**：家族内部的规矩和潜规则必须贯穿始终，不能被轻易打破。
      8. **配角不是工具人**：反派每次出场都不能只是"来找麻烦"。
      9. **金手指使用有节制**：金手指不能每章都用，不能每次都完美解决问题。
      10. **甜宠节奏把控**：甜蜜互动不能太密集，要有"推拉"的节奏感。

    ledgers: |
      ### 升级/逆袭台账
      | 台阶 | 内容 | 起始章 | 完成章 | 标志性事件 | 身份变化 |

      ### 情感线进度台账
      | 阶段 | 描述 | 章节范围 | 标志性名场面 |

      ### 伏笔台账
      | 线索 | 植入 (章) | 强化 (章) | 回收 (章) | 类型 |

      ### 打脸/爽点台账
      | 爽点 | 章节 | 被打脸的人 | 爽点描述 | 铺垫章节 |

  canon:
    sections: |
      ## 商业与股权
      ## 豪门家族
      ## 时间线
      ## 金手指规则
      ## 角色事实
      ## 社交圈层
      ## 都市生活
      ## 内部一致性规则

  chapter_draft:
    genre_specific_detail: |
      都市场景细节要具体有质感——商务谈判的你来我往、高端宴会的觥筹交错、
      豪门大宅的规矩礼仪都要写出来。对话要符合人物身份，总裁说话简短有力，
      豪门太太说话优雅但暗藏机锋。注意区分不同阶层的说话方式。

# ── Evaluation ──
evaluation:
  foundation:
    dimensions:
      business_system:
        label: "商业体系"
        weight_group: "setting"
        description: "公司治理结构是否合理？股权比例、交易金额是否自洽？商战逻辑是否符合商业常识？"
      family_structure:
        label: "豪门家族结构"
        weight_group: "setting"
        description: "家族谱系是否清晰？继承权、嫡庶关系是否明确？家族规矩是否既能制造冲突又留有突破口？"
      urban_setting:
        label: "都市环境"
        weight_group: "setting"
        description: "城市设定是否真实？高端消费、社交圈层是否有具体描写？是否服务于情节推进？"
      cheat_rules:
        label: "金手指规则"
        weight_group: "setting"
        description: "能力边界是否清晰？局限性和风险是否明确？代价是否驱动情节？"
      upgrade_progression:
        label: "升级/逆袭线"
        weight_group: "structure"
        description: "升级台阶是否清晰、可见、有代价？身份变化是否与商战/情感线匹配？"
      face_slap_setup:
        label: "打脸铺垫"
        weight_group: "structure"
        description: "每个打脸/爽点是否有至少1-2章的铺垫？"
    cross_checks:
      - "商业数据交叉验证：公司估值、股权比例、交易金额是否自洽？"
      - "角色对话检查：不同角色是否共享相同句式？去掉标签能分辨谁在说话吗？"
      - "豪门规矩检查：家族规矩是否贯穿始终？是否有被随意打破的情况？"
      - "金手指规则检查：局限性、风险是否明确？是否有规避不写的漏洞？"
      - "文档间矛盾检查：交叉对比年龄、公司、关系、时间线。"
    weights:
      setting: 0.35
      character: 0.25
      structure: 0.30
      craft: 0.10

  chapter:
    dimensions:
      elite_integration:
        label: "豪门感整合度"
        description: "豪门/商界细节在本章中是否有实质作用？是否有都市精英的氛围？"
      emotional_payoff:
        label: "情感回报"
        description: "本章是否有至少一个情感爆发点（爽点/心动/委屈/感动）？"

# ── Reader Personas ──
reader_personas:
  genre_reader: |
    你是一个每年阅读上百部网文的资深读者，特别偏爱女频总裁豪门、甜宠和虐恋文。
    你在乎男主是否够苏、身份落差的反转是否痛快、甜宠互动是否让人心跳加速。
    你讨厌没有逻辑的"霸道"和无脑的"宠"。你敏锐地察觉到人设崩塌、节奏拖沓、
    或者商战写得太假的时刻。你喜欢看冷漠总裁为女主一个人破例的心动瞬间，
    也喜欢看被轻视的女主逆袭打脸的爽感。你对喜欢的情节毫不吝啬赞美，
    对无聊的桥段也会直言不讳。你只用有效的 JSON 格式回复。
  writer: |
    你是一位出版过五部畅销总裁豪门文的资深网络小说作家。
    你从手艺人的角度阅读。你关注结构：情节节拍落点在哪里，伏笔是否回收，
    角色弧光是否完整，商战逻辑是否自洽。你关注作者的技法
    是刻意为之还是无缝融入故事中。你最看重的是"期待感"的建立与释放——
    男主的苏感、女主的成长、身份反转的时机。你在乎小说设定与实际呈现之间的差距。
    你只用有效的 JSON 格式回复。

# ── Voice Template ──
voice_template:
  tone_hint: |
    总裁豪门文的基调参考：
    "都市精英感。像在CBD顶层的落地窗前喝威士忌，
     窗外是万家灯火，杯中是权力与欲望。"
    "冷硬外壳下的柔软。文字像总裁的西装——表面笔挺克制，
     但领带松开的那一刻，才露出真实的温度。"
    "张弛有度的推拉。该冷的时候冷到骨头里，
     该甜的时候一句话让人心跳加速。"
  sentence_rhythm_hint: |
    "商战场景用短促有力的句子，像交锋一样来回打。
     甜蜜场景用细腻的中长句，放慢节奏让读者沉浸。
     豪门冲突场景用快节奏的对话，暗藏机锋。"
    "总裁说话惜字如金，一个字能说完的不用两个字。
     女主内心独白可以丰富，但外在表现要克制。"
  vocabulary_hint: |
    禁用古代词汇（比如"夫君""娘子""小姐"）。
    使用现代都市精英用语。注意不同身份的用语差异：
    总裁：简短有力、商业术语、偶尔英文
    豪门太太：优雅得体、暗含机锋
    职场人：专业术语、KPI、deadline
    闺蜜：直爽、网络用语、八卦语气
    高端品牌名、商业术语要准确（不要把"尽职调查"写成"调查"）。
  pov_hint: |
    总裁豪门文通常使用第三人称有限视角、过去时态，
    紧紧跟着女主的所见所闻所想。男主视角可以偶尔切入，
    但要控制比例（不超过20%），保持男主的神秘感。
  exemplar_scenes:
    - "一段商务谈判场景（有交锋、有博弈、有暗流涌动）"
    - "一段豪门宴会场景（有身份碰撞、有社交潜规则、有意外事件）"
    - "一段甜蜜互动场景（有心动描写、有推拉、有身份反差的萌感）"
    - "一段打脸逆袭场景（有铺垫、有爆发、有扬眉吐气、但不过火）"
    - "一段身份揭露场景（有震撼、有反转、有全场哗然的爽感）"

# ── Mystery Template ──
mystery_template: |
  <!-- 总裁豪门文的悬念通常与身份、商业阴谋、家族秘密相关。
  常见类型：
    - 男主的隐藏身份或不为人知的过去（童年创伤/前任纠葛/身体隐疾）
    - 女主的真实身世（落魄千金/隐藏大佬/与豪门的隐秘关联）
    - 商业阴谋（恶意收购/商业间谍/股权争夺中的暗手）
    - 家族秘密（私生子/遗产纠纷/被掩盖的丑闻）
    - 白月光的真实目的（并非真爱而是另有图谋）
    - 契约/替嫁背后的真正推手 -->
