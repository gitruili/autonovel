  chapter_draft:
    genre_specific_detail: |
      都市场景细节要具体有质感——商务谈判的你来我往、高端宴会的觥筹交错、
      豪门大宅的规矩礼仪都要写出来。对话要符合人物身份，总裁说话简短有力，
      豪门太太说话优雅但暗藏机锋。注意区分不同阶层的说话方式。

    writing_guide: |
      ## 描写规则

      ### 感知驱动，摒弃形容
      用人物感官（视觉/听觉/触觉/嗅觉）所感知到的真实来呈现场景，所见所闻皆暗流汹涌。
      摒弃无意义的场景描写，只聚焦于不寻常的细节。表达简洁，避免精确量化数字。
      描写视觉化，注重动态、对比、反差——但避免滥用形容词和比喻。

      ### 限制视角规则
      你无法通过眼神、动作、细节直接得知他人的动机或目的，仅可做出不准确推断。
      人物内心的想法可以直写，但他人内心的想法只能通过外在行为间接呈现。
      禁用"他知道她在想什么""她看出他的心思"这类上帝视角。

      ### 群众反应制造爽感
      充分利用场景中配角、龙套、路人的反应营造氛围。
      用他们前后反应的变化制造反差和爽感——看客从轻视到震惊，同事从嫉妒到折服。
      总裁豪门文中，一场发布会上全场的哗然、一次董事会上众人交换的眼神，
      比任何内心独白都更有力量。

      ### 展示而非陈述
      用可观察的现象描写情绪：写"他把酒杯攥得指节发白"，不写"他非常愤怒"。
      写"她放下咖啡杯的动作轻得没有声音"，不写"她小心翼翼"。
      不用"她心想/她暗想"引导内心活动——让想法本身作为独立句子出现。

      ## 对话规则

      ### 潜台词与伪装
      对话的灵魂在潜台词。充分运用暗示、嘲讽、伪装、谎言来设计对话。
      人物未必直接给出正确信息——总裁的"知道了"可能是不满，豪门太太的"挺好"可能是死刑判决。
      沉默、留白、身体语言也是无声的对话。人物会磕绊、打断、话没说完。

      ### 身份感与冲突感
      每个人的说话方式必须反映其身份和当下的情绪利益：
      - 总裁：简短有力，一句话能说完不用两句。偶尔英文术语。
      - 豪门太太：优雅得体，绵里藏针。从不骂人但每个字都让人如坐针毡。
      - 职场人：专业术语、KPI语言、谨慎但暗藏野心。
      保持冲突感——避免无意义的寒暄。每段对话都必须推进剧情或揭示人物。

      ## 节奏与结构

      - 改变句子长度。短句用于情绪冲击，长句用于铺陈日常。至少包含 1 个 1-2 句的短段落和 1 个 5 句以上的长段落。
      - 场景优于总结。本章至少 70% 的内容应是即时场景（带对话和动作），而非叙述概括。
      - 从场景中开始一章，不要以铺陈开始。以瞬间结束，不要以总结结束。
      - 章尾钩子必须让读者想翻下一章。钩子是一个具体事件或信息，不是模糊悬念。
      - 滥用分段符（---）是 AI 味。仅在真正的时空跳转处使用。每章最多 2 个。

      ## 总裁豪门专属禁区

      - 不要写男主对女主施暴或控制后美化为"爱"——区分"霸道"和"违法"。
      - 不要写女主是只会哭的"小白花"——她的能力和智慧是她的魅力来源。
      - 商业细节要经得起推敲——并购价格、股权比例不能拍脑门。
      - 不要写"全场安静，落针可闻"——用具体的人物反应代替。
      - 不要用古代感的称谓或举止——这是现代都市，不是古风文。

