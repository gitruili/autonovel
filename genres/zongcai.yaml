# ── Prompt Fragments ──
prompt_fragments:
  seed:
    generate_requirements: |
      ## 每个概念必须包含以下要素

      ### 主要人设
      明确核心人物（如男女主、关键盟友与核心反派）的核心欲望、性格软肋与行为模式。
      主角的金手指/核心优势（如重生记忆、穿书记知、特殊技能、隐藏身份或纯粹靠智商性格等）与局限性/风险是什么？不能让女主无所不能。
      设计男主人设亮点（必须有心结或困境）以及和女主的感情拉扯逻辑（甜宠或虐恋等基调，从契约/对立到日久生情）。
      说明故事发生的具体都市/豪门商业背景（一线/二线城市，老牌世家/新晋财阀，所处产业与家族权力结构）。

      ### 升级线/逆袭线
      女主的核心逆袭路线是什么？要具体到阶段，并且设计出3-4个升级台阶。
      每个台阶都应该对应一个爽点爆发和新的挑战。升级线是故事的骨架。

      ### 主题
      这个故事的精神内核是什么？避免说教。

    diversity_requirements: |
      ## 多样性要求
      确保这 {count} 个概念具有多样性，从以下流派中选取不同方向，不要重复同一种：
        - 契约婚姻流（重心在假戏真做的过程）
        - 替嫁/替身流（重心在身份错位和真相揭露）
        - 重生复仇流（重心在逆袭打脸和商战博弈）
        - 穿书改命流（重心在已知剧情的蝴蝶效应）
        - 隐婚/马甲流（重心在身份揭露的爽感）
        - 混合不同基调：甜宠治愈、虐恋情深、爽文逆袭、细水长流

    prohibitions: |
      ## 禁止生成
        - 男主是完美无缺的"纸片人霸总"（必须有心结和成长弧光）
        - 女主是只会哭的"小白花"（必须有独立人格和核心能力）
        - 金手指没有任何限制、女主无所不能的"躺赢"设定
        - 所有配角都是坏人/所有好人都帮女主的黑白脸谱化
        - 忽略现代法律和商业逻辑的"伪豪门文"（公司治理、股权结构要合理）
        - 纯虐文或BE结局（总裁豪门文的核心是"真爱战胜一切"的希望感）
        - 男主对女主的控制/暴力行为被美化（要区分"霸道"和"违法"）
        - 穿越时空的古代词汇和行为方式

    output_template: |
      ## 输出模板（严格按此格式）

      # 创意<序号>：《<书名>》

      ## 作品简介
      <按照简介设计原则撰写，标签放在最前面，3-4段，短句为主，情绪炸裂>

      ## 核心卖点
