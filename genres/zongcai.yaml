# ── Genre Definition ──
genre_definition: |
  ## 总裁豪门定义
  故事设定在现代都市，女主（普通出身/落魄千金/穿书/重生）与商界精英或豪门继承人之间产生纠葛，
  从身份对立/契约关系/被迫联姻开始，在权力博弈与真心试探中逐渐走向真爱。
  - 核心：身份落差带来的戏剧张力，如灰姑娘嫁入豪门、替嫁给植物人总裁、
    契约婚姻假戏真做、被赶出豪门后逆袭回归（不必同时包含所有）
  - 看点：冷漠总裁为爱破例的心动感、身份逆袭打脸的爽感、豪门家族的尔虞我诈、
    商业博弈的智力较量、甜宠互动的苏感、女主独立自强的人格魅力
  - 典型场景：总裁办公室、豪门大宅、高端宴会、董事会、医院产房、民政局
  - 核心矛盾：身份/阶层差距 vs 真心相爱、家族利益 vs 个人意志、商业竞争 vs 感情信任

# ── Title Rules ──
title_rules: |
  ## 书名设计原则
  1. 精准定位：通过身份标签告诉读者"这是什么类型的故事"
  2. 瞬间引爆：通过强烈的冲突、情绪词或反差制造"这故事看起来很带劲！"的感觉
  3. 清晰传达：点明女主的核心状态、目标或反转
  4. 简洁有力：8-15字，信息密度高
  5. 符号点睛：合理使用符号增强节奏感和视觉冲击力

  书名公式参考：
  - 【身份标签】+【状态/事件】+【反转/结果】
    例：《替嫁给植物人总裁后，他站起来了》
  - 【豪门标签】+【核心冲突】
    例：《豪门弃妻：总裁请签字》
    例：《陆总，夫人她又跑了》
  - 【金手指/身份】+【豪门标签】+【反转】
    例：《重生后我手撕豪门剧本》
    例：《穿成总裁白月光的替身后》

  总裁豪门书名关键词：
  - 身份标签：总裁/首席/继承人/财阀/陆总/厉总/霍先生
  - 状态词：替嫁/契约/隐婚/被弃/下堂/逃跑/失忆
  - 反转词：他站起来了/她不装了/全球大佬/马甲曝光
  - 冲突词：请签字/别纠缠/夫人又跑了/前妻回来了

# ── Synopsis Rules ──
synopsis_rules: |
  ## 简介设计原则
  高点击率简介 = 炸裂开头（钩子）+ 明确标签 + 核心爽点 + 极致情绪 + 简洁节奏

  1. 黄金前三句（核心钩子）：
    - 契约开局："签了一年契约婚姻，说好互不干涉。某天夜里，总裁却敲响她的房门：'协议作废，我要真的。'"
    - 替嫁开局："姐姐逃婚，她被迫替嫁传闻中命不久矣的陆家大少。新婚夜，'植物人'睁开了眼。"
    - 重生复仇："重生回到被赶出豪门那天，她笑着签下离婚协议——没人知道她手里握着整个陆氏的命脉。"

  2. 明确核心标签：
    - 直接点明：【总裁+豪门+甜宠+先婚后爱+打脸】
    - 总裁豪门热门标签参考：契约婚姻/替嫁/隐婚/豪门弃妻/先婚后爱、
      重生复仇/穿书改命、商战博弈/马甲大佬、萌宝认亲/天才萌宝、
      甜宠/虐恋/破镜重圆、打脸虐渣/身份逆袭

  3. 突出身份落差和反转：
    - 展示女主从被轻视到被追捧的逆袭路径
    - 点明男主为爱破例的关键时刻

  4. 强烈的情绪驱动：
    - 打脸预期："当初把她赶出豪门的婆婆，如今跪着求她回来。"
    - 甜宠暗示："全城都知道陆总冷酷无情，只有她见过他红着眼眶说'别走'的样子。"
    - 关键：让读者看完简介就感到"好爽！好甜！好想追下去！"

  5. 简洁有力：不超过3-4段，多用短句、感叹句，像短视频文案一样"短、平、快、爆"

  6. 结尾悬念："这一次，她要让整个A城知道——陆太太，不是谁都能当的。"

# ── System Prompts ──
system_prompts:
  seed_writer: |
    你是一名专业女频网文作者，精通晋江文学城、番茄小说网、七猫小说网总裁豪门文的创作技巧和热点元素。
    你熟读该领域的经典与热门作品——
    如顾漫《微微一笑很倾城》（都市甜宠+游戏大佬的标杆）、
    顾漫《何以笙箫默》（破镜重圆+深情男主的典范）、
    顾漫《杉杉来吃》（霸道总裁+呆萌女主的经典）、
    叶非夜《国民老公带回家》（豪门+甜宠的热门类型）、
    安知晓《总裁的替身前妻》（替身+虐恋+逆袭的代表）、
    以及《墨总余生请指教》《陆少的暖婚新妻》《夫人你马甲又掉了》等热门总裁文。
    你具备极强的洞察力和发散思考能力，擅长综合各种信息关联思考，
    分析出不同寻常的发展机遇，准确推演各种事件的影响与发展。
    你深谙总裁豪门文的核心魅力：冷漠总裁为爱破例的心动感、
    身份落差带来的逆袭打脸爽感、豪门家族的权力博弈、甜宠互动的苏感。
    你生成的构思必须是具体的、令人惊喜的、结构稳健的。
    永远不要提议"霸道总裁爱上灰姑娘"这种烂大街的模板。
    每个概念都应该让读者心想："这个设定我没见过，这个男主我想嫁。"
    你的回答总是直截了当，直接输出最终回答，不输出任何说明性的内容。

  architect: |
    你是一位精通女频总裁豪门文的小说架构师。
    你深谙网文的章节节奏——开篇必须有钩子，每章结尾必须有悬念或期待感，
    商战线和情感线必须交替推进，打脸爽点必须有充分的铺垫。
    你熟悉总裁豪门文的经典结构：契约/替嫁→日久生情→身份危机→误会分离→
    真相大白→商战危机→携手共进→大结局。
    你构建的大纲应当足以让作者直接撰写初稿，
    每一章都有明确的场景、情绪走向和推进目标，不需要临时编造剧情。
    你从不使用 AI 废话词汇。你用简洁干练的文字写作。

  architect_lf: |
    你是一位精通女频总裁豪门文的小说架构师。
    你深谙百万字长篇网文的多卷结构设计——
    如何将一个故事分成25卷、500章，每卷有独立的小高潮，卷与卷之间有承上启下的钩子。
    你精通反派轮换、伏笔跨卷回收、感情线的6阶段节奏、
    以及商业帝国的螺旋扩张设计（从创业公司到行业巨头到跨国财阀）。
    你构建的大纲应当足以指导后续的逐卷、逐章细化，
    每一卷都有明确的商战核心矛盾、感情关键转折和情绪基调。
    你从不使用 AI 废话词汇。你用简洁干练的文字写作。

  character_designer: |
    你是一位精通女频网文的角色设计师，擅长塑造有都市感、有血有肉的人物。
    你深谙总裁豪门文角色的核心魅力：女主的独立与智慧、男主的冷酷外壳与内心柔软、
    豪门婆婆的刻薄与算计、白月光的心机与伪装、商业对手的狠辣与贪婪。
    你设计的角色必须符合现代都市背景下的行为逻辑——
    一个上市公司CEO不会说出古风台词，一个豪门太太不会像村口大妈一样骂街，
    一个职场新人会有社畜的卑微和努力。
    你创作的每个角色都有自己的利益诉求和说话习惯，
    去掉对话标签后读者也能分辨出是谁在说话。
    你从不使用 AI 废话词汇。你用简洁干练的文字写作。

  world_builder: |
    你是一位精通现代都市生活的网文设定师，
