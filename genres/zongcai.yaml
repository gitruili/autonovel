    sections: |
      请按以下章节组织文档：

      ## 城市与商业环境
      故事发生在什么城市？这个城市的商业生态是什么？
      主要产业是什么？高端商圈在哪里？富人区在哪里？

      ## 商业体系
      ### 核心企业
      男主/女主/对手的企业是什么行业？规模多大？上市还是私有？
      ### 股权与治理
      公司的股权结构、董事会构成、决策机制。
      ### 商业竞争
      行业格局、主要竞争对手、市场环境。

      ## 豪门家族
      ### 家族结构
      族谱、辈分、嫡庶、旁系。谁是家主？谁有继承权？
      ### 家族规矩
      门第观念、联姻传统、家规家训、对媳妇/女婿的要求。
      ### 家族产业
      家族控制的核心资产、产业版图、财富规模。
      ### 权力格局
      家族内部的派系、利益联盟、核心矛盾。

      ## 社交圈层
      ### 上流社会
      名媛圈、商会、慈善晚宴、高尔夫俱乐部等社交场所的规矩。
      ### 媒体与舆论
      财经媒体、娱乐八卦、社交媒体对豪门的关注方式。

      ## 日常生活
      ### 居住环境
      豪宅/别墅/顶层公寓/老宅的描写。
      ### 高端消费
      品牌、餐饮、出行、服饰的时代特征。
      ### 感官特征
      皮质沙发、落地窗、红酒、高定西装、豪车等精英符号。

      ## 关键 NPC 与势力（非主角团）

      ## 内部一致性规则（作者不可违反）

  characters:
    requirements: |
      ### 主角设定完整性清单（最高优先级）
      主角（男女主）是全书最重要的设定。你需要在开书之前，把所有能想到的关于主角的信息全部记录下来。
      以下每一项都必须有明确答案，不能留空：

      **外貌与身体**
      - 年龄、身高、体型
      - 外貌特征（3-4 句具体描写，不用套话。要有辨识度——读者能凭这句话在脑中画出这个人）
      - 声线/嗓音特征（低沉/清亮/沙哑/温柔？说话节奏快还是慢？）
      - 衣着风格（日常穿什么？重要场合怎么穿？这反映性格和身份）
      - 标志性外貌细节（如：眼角一颗泪痣、左手腕一道旧疤、永远解开的第二颗纽扣）

      **内在与行为**
      - 性格核心（2-3 个关键词 + 展开解释，不能是"善良""坚强"这种废话）
      - 底线/逆鳞（触碰了会爆发的点——必须足够具体，能直接驱动剧情）
      - 最怕什么、最擅长什么（可冲突——怕被辜负却最擅长推开人）
      - 行事风格（遇到问题先想还是先做？对人先信任还是先防备？）
      - 身体习惯/下意识小动作（至少 2 个，用于在正文中展示而非陈述角色状态）

      **能力与资源**
      - 金手指/核心优势（必须明确能力边界、使用代价、冷却期。不能无所不能。）
      - 专业技能/教育背景（总裁豪门文需要有真实的专业素养支撑）
      - 人脉关系（开场时拥有的人脉，以及这些人脉的状态：亲密/疏远/敌对？）
      - 资产状况（开场时的经济水平，与金手指/资源的关系）

      **心理与情感**
      - 内心情感变化的关键节点（什么情况下会哭？什么时候硬撑？对谁心软？）
      - 口头禅/语言癖好（仔细选，这句话会成为角色签名）
      - 情感模式（对爱情的态度：渴望但不敢信？冷静计算得失？奋不顾身？）

      **背景与羁绊**
      - 家庭关系（父母、兄弟姐妹、家族地位——明确列出并描述关系状态）
      - 关键过去事件（至少 2 个塑造了她/他现在的性格的事件）
      - 社会身份（公开身份 vs 真实身份，如有隐藏身份需详述）

      ### 核心驱动力框架
      每个主要角色都必须有清晰的驱动力链条：
        处境 (SITUATION) → 她/他最迫切想要什么？(WANT)
          → 她/他真正需要什么？(NEED，通常与 WANT 矛盾)
          → 她/他心底的错误信念是什么？(LIE，阻碍她/他的心结)
          → 她/他的弧光走向 (ARC，LIE 被打破或强化的过程)

      ### 配角设计核心原则：以主角为锚点
      所有配角的设定必须扎根于一个锚点——与主角的关系。
      配角的年龄、外貌、性格、口头禅等不是凭空设定，而是围绕主角来打造：
      - 每个配角必须回答："这个角色为什么存在？ta 对主角来说意味着什么？"
      - 配角的功能定位（盟友/对手/导师/挚友/镜子）必须比性格描述更优先
      - 每个配角至少有 1 条与主角之间的、会随着故事发展而变化的关系线
      - 例如：一个搞笑配角，她的"搞笑"不是孤立属性，而是意味着她总在主角最紧张时用荒诞的方式解围

      ### 特殊人物设计原则：以功能为锚点
      特殊人物（师父、前辈、幕后大佬等）的设定必须扎根于一个关键点——对主角的作用。
      - 师父：教导主角什么？用什么方式？师徒关系中的冲突点是什么？
      - 前辈：给主角提供什么安全感或资源？有什么限制条件？
      - 幕后大佬：为什么欣赏主角？ta 给主角的机缘附带什么代价？
      - 这类角色不需要完整弧光，但必须有清晰的功能边界——不能什么忙都能帮

      ### 特殊角色（非人物角色）
      网文中角色不限于"人"——宝物、宠物、智能工具等也应有设定。
      这类角色只需设定一个简单的"印象"即可：
      - 名称 + 一句话核心特征（如：一面专门坑主人的镜子、一条好吃懒做的狗）
      - 来历（怎么到主角手里的？）
      - 对主角的功能（助攻/添乱/提供信息？）
      - 性格/脾气（哪怕一个物件也可以有"脾气"）

      ### 对话辨识度（6 个维度，适配总裁豪门文）
      1. 用词习惯：文雅/粗俗/口头禅/商业术语/英文夹杂
      2. 句子长短：碎嘴啰嗦型还是惜字如金型？
      3. 说话语气：命令式/阴阳怪气/绵里藏针/温柔低沉
      4. 口头禅/语言癖好（注意身份差异：总裁的简短有力、豪门太太的优雅刻薄、闺蜜的直爽）
      5. 隐喻来源：商人用战争/棋局比喻、名媛用时尚比喻、职场人用KPI比喻
      6. 潜台词能力：话里有话还是有话直说？（总裁豪门文中潜台词极为重要）

      ### 人物关系网（总裁豪门文核心）
      总裁豪门文的戏剧张力大量来自人际关系。每个角色都必须：
      - 与至少 2 个其他角色存在利益冲突或情感纠葛
      - 有至少 1 个可能在故事中发生转变的关系
      - 身份地位和经济实力必须影响人物关系

    role_types: |
